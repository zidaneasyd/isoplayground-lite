<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Menu Kiri - Properti Tile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #f3f3f3;
      display: flex;
      min-height: 100vh;
      font-size: 12px;
    }

    /* Panel Menu Kiri */
    .left-sidebar {
      width: 248px;
      background-color: #1c1c1c;
      border-right: 1px solid #2b2b2b;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Baris Item Pengaturan */
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 10px;
      padding: 4px 6px;
      margin: 0 -6px;
      border-radius: 5px;
    }

    .setting-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .setting-title {
      font-size: 12px;
      font-weight: 600;
      color: #efefef;
      line-height: 1.25;
    }

    .setting-desc {
      font-size: 10.5px;
      color: #9e9e9e;
      line-height: 1.3;
    }

    /* Slot Kontrol Kanan: lebar & tinggi konsisten agar sejajar presisi */
    .setting-control {
      width: 84px;
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    /* Kontrol Stepper (- 0 +) rata penuh di kolom kanan */
    .stepper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      background-color: transparent;
    }

    .stepper-btn {
      width: 24px;
      height: 100%;
      background: transparent;
      border: none;
      color: #b8b8b8;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .stepper-btn:hover {
      background-color: #282828;
      color: #ffffff;
    }

    .stepper-btn:active {
      background-color: #323232;
    }

    .stepper-value {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      user-select: none;
    }

    /* Custom Dropdown (Terrain) rata penuh di kolom kanan */
    .custom-select {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
    }

    .select-trigger {
      width: 100%;
      height: 100%;
      background-color: transparent;
      border: none;
      border-radius: 4px;
      padding: 0 20px 0 6px;
      color: #efefef;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      transition: background-color 0.15s ease;
    }

    .select-trigger span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .select-trigger:hover,
    .custom-select.open .select-trigger {
      background-color: #282828;
    }

    .select-arrow {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      color: #b5b5b5;
      pointer-events: none;
      transition: transform 0.15s ease;
    }

    .custom-select.open .select-arrow {
      transform: translateY(-50%) rotate(180deg);
    }

    .select-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      width: 100%;
      min-width: 112px;
      background-color: #222222;
      border: 1px solid #323232;
      border-radius: 6px;
      padding: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      z-index: 20;
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .custom-select.open .select-menu {
      display: flex;
    }

    .select-option {
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 6px 8px;
      color: #dcdcdc;
      font-size: 11.5px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .select-option:hover {
      background-color: #2e2e2e;
      color: #ffffff;
    }

    .select-option.selected {
      background-color: rgba(37, 116, 245, 0.16);
      color: #6ea6ff;
      font-weight: 500;
    }

    /* Toggle Switch (Walkable) rata kanan di dalam kolom kontrol */
    .toggle-wrapper {
      position: relative;
      width: 30px;
      height: 16px;
      align-self: center;
      margin-left: auto;
      flex-shrink: 0;
      cursor: pointer;
    }

    .toggle-wrapper input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background-color: #3a3a3a;
      border-radius: 999px;
      transition: background-color 0.16s ease;
    }

    .toggle-track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ffffff;
      transition: transform 0.16s ease;
    }

    .toggle-wrapper input:checked ~ .toggle-track {
      background-color: #2574f5;
    }

    .toggle-wrapper input:checked ~ .toggle-track::after {
      transform: translateX(14px);
    }

    /* Area Konten Utama (Placeholder) */
    .main-viewport {
      flex: 1;
      background-color: #141414;
    }
  </style>
</head>
<body>

  <!-- Panel Menu Kiri -->
  <aside class="left-sidebar">

    <!-- Elevation -->
    <div class="setting-row">
      <div class="setting-info">
        <span class="setting-title">Elevation</span>
        <span class="setting-desc">Ketinggian tile dalam unit dunia</span>
      </div>
      <div class="setting-control">
        <div class="stepper">
          <button type="button" class="stepper-btn" id="btn-minus" aria-label="Kurangi elevation">−</button>
          <div class="stepper-value" id="elevation-value">0</div>
          <button type="button" class="stepper-btn" id="btn-plus" aria-label="Tambah elevation">+</button>
        </div>
      </div>
    </div>

    <!-- Terrain (Custom Dropdown) -->
    <div class="setting-row">
      <div class="setting-info">
        <span class="setting-title">Terrain</span>
        <span class="setting-desc">Identitas permukaan tile</span>
      </div>
      <div class="setting-control">
        <div class="custom-select" id="terrain-dropdown" data-value="default">
          <button type="button" class="select-trigger" id="terrain-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="terrain-label">default</span>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="select-menu" role="listbox" aria-label="Terrain">
            <button type="button" class="select-option selected" role="option" aria-selected="true" data-value="default">default</button>
            <button type="button" class="select-option" role="option" aria-selected="false" data-value="grass">grass</button>
            <button type="button" class="select-option" role="option" aria-selected="false" data-value="water">water</button>
            <button type="button" class="select-option" role="option" aria-selected="false" data-value="stone">stone</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Walkable Toggle (Klik langsung di toggle) -->
    <div class="setting-row">
      <div class="setting-info">
        <span class="setting-title">Walkable</span>
        <span class="setting-desc">Tile dapat dilalui</span>
      </div>
      <div class="setting-control">
        <label class="toggle-wrapper" for="walkable-toggle">
          <input type="checkbox" id="walkable-toggle" role="switch" checked aria-label="Walkable" />
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

  </aside>

  <!-- Area Kanvas / Viewport Utama -->
  <main class="main-viewport"></main>

  <script>
    const minusBtn = document.getElementById('btn-minus');
    const plusBtn = document.getElementById('btn-plus');
    const valueDisplay = document.getElementById('elevation-value');
    let elevation = 0;

    minusBtn.addEventListener('click', () => {
      elevation--;
      valueDisplay.textContent = elevation;
    });

    plusBtn.addEventListener('click', () => {
      elevation++;
      valueDisplay.textContent = elevation;
    });

    // Custom Dropdown Terrain
    const dropdown = document.getElementById('terrain-dropdown');
    const trigger = document.getElementById('terrain-trigger');
    const label = document.getElementById('terrain-label');
    const options = dropdown.querySelectorAll('.select-option');

    function closeDropdown() {
      dropdown.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
    }

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = dropdown.classList.toggle('open');
      trigger.setAttribute('aria-expanded', String(isOpen));
    });

    options.forEach((opt) => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = opt.dataset.value;
        dropdown.dataset.value = val;
        label.textContent = val;

        options.forEach((item) => {
          const isSelected = item === opt;
          item.classList.toggle('selected', isSelected);
          item.setAttribute('aria-selected', String(isSelected));
        });

        closeDropdown();
      });
    });

    document.addEventListener('click', closeDropdown);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDropdown();
    });
  </script>

</body>
</html>
